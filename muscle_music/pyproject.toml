[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jilv-music"
version = "0.1.0"
description = "Gesture-driven, locally generated MIDI music engine for EMG and IMU armbands"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mido>=1.3,<2",
  "python-rtmidi>=1.5,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
jilv-engine = "jilv.app:main"
jilv-simulator = "jilv.simulator:main"
jilv-list-midi = "jilv.midi:list_ports_main"
jilv-preview = "jilv.preview:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
